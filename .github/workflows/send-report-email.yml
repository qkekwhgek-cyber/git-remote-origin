name: Send Daily Report Email

on:
  push:
    paths:
      - 'daily-reports/**.md'

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          FILE=$(git diff-tree --no-commit-id -r --name-only $COMMIT_SHA | grep '^daily-reports/' | head -1)
          DATE=$(basename $FILE .md)
          export FILE DATE
          python3 - << 'PYEOF'
          import smtplib, os
          from email.mime.text import MIMEText

          user = os.environ['GMAIL_USER']
          password = os.environ['GMAIL_PASSWORD']
          file_path = os.environ['FILE']
          date = os.environ['DATE']

          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()

          msg = MIMEText(content, 'plain', 'utf-8')
          msg['Subject'] = f'일일 트렌드 리포트 - {date}'
          msg['From'] = user
          msg['To'] = user

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as smtp:
              smtp.login(user, password)
              smtp.send_message(msg)

          print(f"Email sent: {date}")
          PYEOF
